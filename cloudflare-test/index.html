<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudflare Pages Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font: 16px/1.5 system-ui, sans-serif;
      color: #172033; background: linear-gradient(135deg, #eef5ff, #f7f3ff);
    }
    main {
      width: min(100%, 560px); padding: 36px; border-radius: 20px;
      background: white; box-shadow: 0 16px 50px #24385b18; text-align: center;
    }
    .check { font-size: 48px; }
    h1 { margin: 12px 0 8px; }
    p { color: #526078; }
    code { background: #f1f4f8; padding: 3px 7px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">✅</div>
    <h1>Cloudflare Pages is working!</h1>
    <p>This sample page was deployed from your GitHub repository.</p>
    <p><strong>Repository:</strong> <code>Shirsh3/gujarat-family-trip</code></p>
    <p>If you can see this page, the GitHub → Cloudflare deployment is successful.</p>
  </main>
</body>
</html>
