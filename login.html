<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Trip · Sign in</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5ef;color:#172d2a;font:15px/1.5 system-ui,sans-serif}.box{width:min(410px,calc(100% - 32px));background:#fffefa;border:1px solid #e9e5da;border-radius:20px;padding:30px;box-shadow:0 18px 50px #16352a12}h1{font:30px Georgia;margin:0 0 8px}p{color:#697b75}label{display:block;margin:15px 0 5px;font-weight:600}input{width:100%;padding:13px;border:1px solid #dcd8cd;border-radius:10px;font:inherit}button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:#1f594d;color:white;font-weight:700;font-size:15px;cursor:pointer}#status{min-height:24px;font-size:13px;color:#a13a32}</style></head><body><main class="box"><h1>Welcome back</h1><p>Sign in to view the family trip website.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="40"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button>Sign in</button><p id="status" role="status"></p></form></main><script>const form=document.getElementById('login');form.addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed');const next=new URLSearchParams(location.search).get('next')||'/';location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/');}catch(err){status.textContent=err.message;}});</script></body></html>
