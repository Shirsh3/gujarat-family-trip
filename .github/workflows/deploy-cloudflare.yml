name: Test and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  test:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker syntax and application smoke tests
        run: npm run check

  deploy:
    name: Migrate D1 and deploy Worker
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply pending production D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply gujarat-trip-reviews --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health endpoint
        env:
          HEALTH_URL: https://gujarat-family-trip.shirsh3.workers.dev/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl --silent --show-error --max-time 20 "$HEALTH_URL" || true)"
            echo "Health check attempt $attempt: $response"
            if echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.ok===true && x.databaseConnected===true && x.aiConfigured===true ? 0 : 1)}catch{process.exit(1)}})'; then
              echo "Production Worker, D1 and AI binding are healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Production health check did not pass."
          exit 1
